name: Krypton Cross-Platform Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.package_name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            package_name: krypton-windows-x64-setup.exe
            bundle_subdir: nsis
            bundle_glob: "*.exe"
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos
            package_name: krypton-macos-x64.dmg
            bundle_subdir: dmg
            bundle_glob: "*.dmg"
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            package_name: krypton-macos-arm64.dmg
            bundle_subdir: dmg
            bundle_glob: "*.dmg"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            package_name: krypton-linux-x86_64.AppImage
            bundle_subdir: appimage
            bundle_glob: "*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun (Compiler Engine)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install

      - name: Validate Environment
        run: node scripts/setup-env.mjs

      - name: Build Monorepo Packages
        run: |
          pnpm --filter @krypton/shared-types build
          pnpm --filter @krypton/agent-runtime build
          pnpm --filter @krypton/cli build

      - name: Compile Internal Sidecars (Daemon & CLI)
        run: |
          node scripts/build-sidecar.mjs --target ${{ matrix.target }}
          node scripts/build-cli.mjs --target ${{ matrix.target }}

      - name: Build Next.js Desktop Dashboard
        run: pnpm --filter desktop build

      - name: Build Native Tauri Bundle
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
          includeRelease: false
          includeUpdaterJson: false

      - name: Stage Single Unified Release Package & Compute SHA-256
        shell: bash
        run: |
          mkdir -p release-assets

          BUNDLE_SRC=""
          POSSIBLE_DIRS=(
            "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_subdir }}"
            "apps/desktop/src-tauri/target/release/bundle/${{ matrix.bundle_subdir }}"
          )

          for dir in "${POSSIBLE_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              MATCH=$(find "$dir" -maxdepth 2 -type f -name "${{ matrix.bundle_glob }}" | head -n 1)
              if [ -n "$MATCH" ]; then
                BUNDLE_SRC="$MATCH"
                break
              fi
            fi
          done

          if [ -z "$BUNDLE_SRC" ]; then
            echo "::error::Could not find generated bundle for ${{ matrix.target }} in expected bundle directories."
            exit 1
          fi

          echo "✔ Located primary bundle source: $BUNDLE_SRC"
          cp "$BUNDLE_SRC" "release-assets/${{ matrix.package_name }}"

          cd release-assets
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.package_name }}" > "${{ matrix.package_name }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.package_name }}" > "${{ matrix.package_name }}.sha256"
          fi

          echo "✔ Release package staged:"
          ls -lh

      - name: Upload Single Unified Package to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/${{ matrix.package_name }}
            release-assets/${{ matrix.package_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
