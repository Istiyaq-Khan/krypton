name: Krypton Cross-Platform Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun (Compiler Engine)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install

      - name: Validate Environment
        run: node scripts/setup-env.mjs

      - name: Build Shared Types & Packages
        run: |
          pnpm --filter @krypton/shared-types build
          pnpm --filter @krypton/agent-runtime build
          pnpm --filter @krypton/cli build

      - name: Compile Sidecar Daemon Binary
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}

      - name: Compile Standalone CLI Binary
        run: node scripts/build-cli.mjs

      - name: Build Next.js Desktop Dashboard
        run: pnpm --filter desktop build

      - name: Build Native Tauri Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Krypton v__VERSION__"
          releaseBody: "Autonomous Desktop AI Agent Runtime — Release v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
